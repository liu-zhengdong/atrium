name: 检查
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      # 不改 core.autocrlf：检出一律 LF 由 .gitattributes 保证，Windows 上与开发机默认设置一致。
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      # 格式不过也照跑测试，一次看全三平台结果。
      - run: npm run check
        if: ${{ !cancelled() }}
      - run: npm run bench:cli
        env:
          ATRIUM_BENCH_LIMIT_MS: "300"
  # 主路径端到端（#353）：打包、装进临时 prefix，用假执行者走 atrium → task add/run/wait → org tree
  # → quota → events wait → restart（在跑执行者被接管）→ stop。结果写进 PR，不挡合入。
  e2e:
    name: e2e (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run e2e
