name: CI
# 体检：vet、全部测试、三平台交叉编译。只报不挡——合入前的检查是运行时合入队列跑的 .agents/check；这里挂了就找出是哪次合入弄坏的，先回滚。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - name: 三平台交叉编译
        run: |
          for goos in darwin linux windows; do
            GOOS=$goos go vet ./...
            GOOS=$goos GOARCH=amd64 go build ./...
          done
  smoke:
    name: 端到端冒烟 (${{ matrix.os }})
    # 独立体检，不作为合入或发版的前置条件；一台失败仍跑完其他平台。
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: 安装 pnpm
        run: npm install --global pnpm@10
      - name: Linux 冒烟依赖
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y jq ffmpeg
      - name: macOS 冒烟依赖
        if: runner.os == 'macOS'
        run: brew install jq ffmpeg
      - name: Windows 冒烟依赖
        if: runner.os == 'Windows'
        run: |
          # choco 部分失败（如社区源 504）仍可能返回 0，装完立即核对，缺了当场报，不拖到 smoke.sh 才发现。
          choco install jq ffmpeg --yes --no-progress
          for tool in jq ffmpeg; do
            command -v "$tool" >/dev/null 2>&1 || {
              echo "::error::Windows 冒烟依赖未装上：找不到 ${tool}，安装报错见上方 choco install 的输出（常见为社区源临时不可用，重跑本 job 即可）"
              exit 1
            }
          done
      - name: 平台包测试
        # check 只在 Linux 跑测试；权限、进程这类按平台分文件的测试要在各自平台上跑。
        run: go test ./internal/platform/
      - name: 隔离实例端到端冒烟
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          set -o pipefail
          bash scripts/smoke.sh 2>&1 | tee "$RUNNER_TEMP/smoke.log"
      - name: 保存冒烟日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.os }}
          path: ${{ runner.temp }}/smoke.log
          retention-days: 7
