name: Atrium 版本发布
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: read
concurrency:
  group: atrium-release
  cancel-in-progress: false
jobs:
  release:
    if: ${{ !startsWith(github.event.head_commit.message, '发布 v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
      - name: 从合入 PR 取摘要并计算补丁版本
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          summary=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" --jq '.[0].title // empty')
          if [ -z "$summary" ]; then summary=$(git log -1 --format=%s); fi
          version=$(node scripts/prepare-release.mjs "$summary")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "summary=$summary" >> "$GITHUB_OUTPUT"
      # 不再重跑测试：合入队列已在合入前按 .agents/check 检查过这个提交（与发版同一个提交），
      # 全量测试由 check.yml 在每次推送时跑、作体检，不挡发版（用户 09-28 定）。
      # 编译安装产物（dist/），并在它上面起隔离服务量命令行启动；产物跑不起来就不发版。
      - run: npm run bench:cli
        env:
          ATRIUM_BENCH_LIMIT_MS: "300"
      - name: 提交安装产物及版本标签
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          SUMMARY: ${{ steps.version.outputs.summary }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json releases.json
          git commit -m "发布 v${VERSION}"
          git push origin HEAD:main
          # dist/ 只进版本标签：标签指向版本提交之上再加一个带编译产物的提交，main 不含 dist/。
          # 从标签安装（atrium update、README）时 npm pack 直接沿用它，不需要 esbuild。
          git add -f dist
          git commit -m "v${VERSION} 安装产物"
          git tag "v${VERSION}"
          git push origin "v${VERSION}"
          gh release create "v${VERSION}" --title "v${VERSION}" --notes "$SUMMARY"
